name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PGPASSWORD: postgres
  ADMIN_URL: postgres://postgres:postgres@localhost:5432
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/openparking_test
  APP_DATABASE_URL: postgres://openparking_app:ci_password@localhost:5432/openparking_test
  APP_DB_PASSWORD: ci_password

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commercial-values guard below reads COMMIT
          # MESSAGES as well as files, and at depth 1 a pull-request checkout is
          # one synthetic merge commit, so its commit half would see nothing.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: No dependency with a known high or critical problem
        # Read against the advisories of the day the job runs, so an advisory
        # published after a change was green turns the next run red.
        run: npm audit --audit-level=high

      - name: No real personal data in the repository
        run: node .github/scripts/check-no-real-data.js --self-test

      - run: npm run check-no-real-data

      - name: No commercial value of a deployment (self-test)
        # Before trusting the scan, prove it can fail: it plants a VALUE -- a
        # URL, an account id, a key -- and requires each refused, and requires
        # the field names to pass.
        run: node .github/scripts/check-no-commercial-values.js --self-test

      - name: No commercial value of a deployment (this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-no-commercial-values.js "$BASE..$HEAD"

      - name: No commercial value of a deployment (whole history)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/check-no-commercial-values.js

      - name: No name from outside this project (self-test)
        # Before trusting the scan, prove it can fail: a planted word is found
        # in a line, inside an identifier and in a path; a longer word holding
        # it is not.
        run: node .github/scripts/check-no-sibling-names.js --self-test

      - name: No name from outside this project (this pull request)
        # Every tracked file's contents AND path, and the PR's commit messages.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-no-sibling-names.js "$BASE..$HEAD"

      - name: No name from outside this project (whole history)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/check-no-sibling-names.js

      - name: No name from outside this project (working tree)
        # Tracked and untracked files, contents and paths, and every commit
        # message. Plants its own controls -- a word in a file, a word in a
        # file's name -- and requires each caught, in the same run, before the
        # real scan is read.
        run: node .github/scripts/check-no-sibling-names.js --worktree

      - name: The screen's characters, against the screen (self-test)
        # Before trusting the comparison, prove it can fail: a character
        # planted on each side, in memory, must be caught.
        run: node scripts/check-screen-characters.js --self-test

      - name: The screen's characters, against the screen
        # src/screen-characters.json against gate-agent's font at the commit
        # the copy names: the same set, or red naming the characters.
        run: node scripts/check-screen-characters.js

      - name: Migration 0002's SQL is frozen
        # Its comments may change; its statements may not. It is applied
        # everywhere it will ever be applied.
        run: bash scripts/assert-0002-sql-unchanged.sh

  suite:
    name: suite
    # The suite and the fail-controls that take seconds. The ones that take
    # minutes run beside it in `controls` and `sign-in-control`; `test` below
    # is green only when all three are.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/test-environment

      - name: The suite runs with no Stripe Connect configured
        # The standalone arm: a self-hoster with no Connect -- or no Stripe --
        # gets a platform that behaves exactly as it did before Connect code
        # existed. Every test below runs in this environment, so this is
        # asserted rather than assumed; test/standalone-arm.test.js boots the
        # real entrypoint the same way.
        run: |
          for v in STRIPE_API_KEY STRIPE_API_BASE CONNECT_RETURN_URL CONNECT_REFRESH_URL; do
            if [ -n "$(printenv "$v")" ]; then echo "$v is set; the suite must run without Connect"; exit 1; fi
          done
          echo "no Connect setting present"

      - name: The suite runs with no validations door named
        # This repository names no validations module: VALIDATIONS_DOOR has no
        # default, and unset means the deployment has none. The tests that need
        # the door name the stand-in themselves; everything else runs as a
        # deployment without one.
        run: |
          if [ -n "$(printenv VALIDATIONS_DOOR)" ]; then echo "VALIDATIONS_DOOR is set; the suite must run without it"; exit 1; fi
          echo "no validations door named"

      - name: Tests
        run: npm test

      - name: Retention purge runs clean on a fresh database
        run: npm run purge

      - name: RLS fail-control
        # Proves the isolation suite actually measures isolation, by requiring
        # it to FAIL against a scratch database with RLS stripped out.
        run: npm run rls-fail-control

      - name: Schema-gate fail-control
        # The deploy-ordering constraint, encoded rather than remembered.
        #
        # `/lane/rules` serves columns, and `getGarage` is `SELECT *`: a column
        # this code expects and the database has not got is not an error and
        # not a null. The key is dropped, the route answers 200 with a shorter
        # payload, and the lane reads the absence as unmeasured -- so an
        # unknown plate that would have been admitted takes the lane's FALLBACK
        # path instead, a ticket and a human rather than a refusal, with no
        # error and no symptom anywhere. Measured on `default_action` when 0004
        # was written.
        #
        # `src/schema.js` refuses to start the process while any migration this
        # build ships with has no row in `schema_migrations`. This requires
        # that refusal to actually happen: a scratch database is migrated with
        # the newest file withheld, and the service must fail to start, naming
        # the file. Then the migration is applied and the same command must
        # serve -- a gate that refuses everything is not a gate either.
        run: npm run schema-gate-control

      - name: Devices-and-codes fail-control
        # This round published two things a consumer OUTSIDE this platform
        # depends on: `last_seen_at` on the devices route, so a lane that has
        # gone quiet can be told from one that is idle; and a `code` on every
        # conflict, so a clock skew dead-lettering every session can be told
        # from an ordinary refusal. Each break removes exactly one of those
        # properties -- including unwiring `touch_lane_device`, which leaves the
        # route publishing a column nothing sets -- and requires the suite to go
        # red. A route that serves a dead column reads exactly like one that
        # works, right up until a lane dies.
        run: npm run devices-and-codes-fail-control

      - name: Ticket-identity fail-control
        # A stay can now be identified by something no camera read. Each break
        # removes exactly one property that makes that safe rather than merely
        # possible -- the exactly-one rule at the route AND at the constraint,
        # the ticket's shape, the lookup that must not match a plate and a
        # ticket of the same text, the close that keeps a ticket stay billable,
        # and the retention purge reaching the new column -- and requires the
        # suite to go red. Two of them build a scratch database from a copy of
        # `migrations/` with one constraint edited out, because a rule enforced
        # only at a route is a rule one direct INSERT goes around.
        run: npm run ticket-identity-fail-control

      - name: Descriptor fail-control
        # A session carries the appearance descriptor its entry read produced
        # (migration 0009) and the one its exit read produced (0010). Each break
        # removes one property that makes holding them safe -- a route reading
        # the field at all (the silent-drop defect the round exists for), the
        # write, the response ECHOING it (the lane's only way to see it was
        # kept), the bound, the retention purge reaching both columns, and the
        # constraint that an open stay holds no exit descriptor (a scratch
        # database with the statement edited out), and the candidate set built
        # over them (closed stays out, other garages out, the descriptor on,
        # no plate to the search) -- and requires the suite to go red.
        run: npm run descriptor-fail-control

      - name: Shadow-run fail-control
        # The search is called for real exits, its answer recorded, nothing
        # acts on it -- and the record means something only if the snapshot
        # is taken inside the close BEFORE exit_at is written (the race), the
        # event carries session ids and never a descriptor, an outcome outside
        # the closed set is refused, a tie is not a match, and every rate is
        # over the rows that have an oracle. Each is broken in turn.
        run: npm run shadow-fail-control

      - name: Rate-plans fail-control
        # A garage's rate plans are held whole, validated by the engine
        # before they are stored, read back as the whole list the engine
        # prices from, and a closed stay keeps the version and the breakdown
        # that priced it. Each property is broken in turn -- the route
        # storing unvalidated, findings ignored, the document shredded, the
        # read returning one, currency unchecked, an unreachable engine
        # counted as a yes, no event, the breakdown dropped, and four schema
        # statements never created -- and the suite must go red.
        run: npm run rate-plans-fail-control

      - name: Pricing fail-control
        # The close prices through the engine and a close that cannot price
        # still closes. Each property is broken in turn -- the 409 put back,
        # the refusal uncaught, an outage recorded as a refusal, the platform
        # selecting the latest version, the class hard-coded, the ledger
        # dropped, the event dropped, the report hiding the row, the store
        # ignoring the class, and two schema statements never created -- and
        # the suite must go red.
        run: npm run pricing-fail-control

      - name: Activation-gate fail-control
        # A garage is not usable until its rate setup is complete and its
        # transient mode is stated; an inactive garage opens and closes
        # nothing, by name and on the record. Each property is broken in
        # turn -- the gate off at the lane, the refusal unrecorded, each
        # condition satisfied by nothing, null accepted as a statement, a
        # processor surface planted in activation, the rules lying, the trigger never
        # created, the trigger counting stored instead of in force -- and the
        # suite must go red.
        run: npm run activation-fail-control

      - name: Rules-payload fail-control
        # The rules payload carries the plans whole, the space class, each
        # linked module's register verbatim (an outage said, never filled
        # in), the open stays with a cursor, a delta with closed rows and a
        # cursor that never runs ahead of what it delivered, and no hourly
        # figure; the rates route refuses by name. Each property is broken in
        # turn, plus the cursor trigger never created, and the suite must go
        # red.
        run: npm run rules-payload-fail-control

      - name: Lane-decided-close fail-control
        # The close consumes the lane's decision and stores what it decided
        # from; the reconciler recomputes out of band, names the lane that
        # wrote fee + 1, and corrects nothing. Each property is broken in
        # turn, plus the attribution constraint never created, and the suite
        # must go red.
        run: npm run lane-decided-close-fail-control

      - name: Lane-decision-sweep fail-control
        # The reconciler looks without being asked, with no window over it,
        # records what it found on the row and in an append-only event, and
        # corrects nothing. Each property is broken in turn, plus the verdict
        # constraint never created, and the suite must go red.
        run: npm run lane-decision-sweep-fail-control

      - name: Garage-reads fail-control
        # The owner's three reads. Each break removes one property -- a tenant
        # predicate (list, garage, lanes), the 404 for another tenant's garage,
        # "live", the exact garage shape, revoked_at on a device, the unbound
        # reader hidden, the credential hash kept out -- and requires the reads
        # suite and the isolation suite to go red.
        run: npm run garage-reads-fail-control

      - name: Owner-language fail-control
        # The owner's language (0025). Each break removes one property -- the
        # admin taken from the session, never the body; only "en" or "es"; the
        # query not read, in either spelling; the Origin rule; the language on sign-in and on
        # /auth/me; the column's check and its English default -- and requires
        # test/owner-language.test.js to go red.
        run: npm run owner-language-fail-control

      - name: Lane-reader fail-control
        # A garage's Location and each reader (0021) are registered ON the
        # garage's own account, refused while Stripe -- asked now, not an old
        # read -- says it cannot take a card; a lane holds one reader and a
        # reader one lane, at the route and at the table; ending a binding is
        # recorded, never deleted, and the history is listed. Each property
        # is broken in turn, plus three schema statements never created, and
        # the suite must go red.
        run: npm run lane-reader-fail-control

      - name: Standalone-arm fail-control
        # With no Connect configured the real entrypoint starts, ordinary
        # routes behave as before, and each Connect route answers one
        # sentence. Each property is broken in turn -- a key demanded at boot,
        # Connect assumed, the sentence reworded -- and the suite must go red.
        run: npm run standalone-arm-fail-control

      - name: Tax-on-the-stay fail-control
        # Tax on what the driver pays (0023): base lines, the validation, then
        # the tax, taken on the subtotal after the validation at the stay's
        # exit instant; a lane decision taxed with a set it did not hold is not
        # written; the table refuses a subtotal and tax lines that do not make
        # the fee. Each is broken on a copy of the tree (one on a scratch
        # database) and test/tax-on-paid.test.js must go red every time.
        run: npm run tax-on-paid-fail-control

      - name: A test file whose before throws ends red, not hung
        # Each file that once closed `server` unguarded in its `after` is run
        # with a throw planted in its `before`, and must exit non-zero inside a
        # minute. The positive control puts one unguarded close back and
        # requires a HANG, so this step can see the failure it exists for.
        run: npm run hanging-hooks-control

  controls:
    name: controls
    # The fail-controls that take minutes each, beside `suite`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/test-environment

      - name: The suite runs with no Stripe Connect configured
        # The standalone arm: a self-hoster with no Connect -- or no Stripe --
        # gets a platform that behaves exactly as it did before Connect code
        # existed. Every test below runs in this environment, so this is
        # asserted rather than assumed; test/standalone-arm.test.js boots the
        # real entrypoint the same way.
        run: |
          for v in STRIPE_API_KEY STRIPE_API_BASE CONNECT_RETURN_URL CONNECT_REFRESH_URL; do
            if [ -n "$(printenv "$v")" ]; then echo "$v is set; the suite must run without Connect"; exit 1; fi
          done
          echo "no Connect setting present"

      - name: The suite runs with no validations door named
        # This repository names no validations module: VALIDATIONS_DOOR has no
        # default, and unset means the deployment has none. The tests that need
        # the door name the stand-in themselves; everything else runs as a
        # deployment without one.
        run: |
          if [ -n "$(printenv VALIDATIONS_DOOR)" ]; then echo "VALIDATIONS_DOOR is set; the suite must run without it"; exit 1; fi
          echo "no validations door named"

      - name: Exit-outcomes fail-control
        # The exit has three named outcomes and two modules are consulted
        # through their own doors before pricing. Each property is broken in
        # turn -- covered still priced, not-covered counted as covered, one
        # module skipped either way, could-not-decide recorded as transient,
        # a link stored unprobed, a covered exit unrecorded, the answers
        # dropped, the third outcome produced, the purge keeping the record,
        # a ticket stay consulted without its ticket, and two schema
        # statements never created -- and the suite must go red.
        run: npm run exit-outcomes-fail-control

      - name: Validations fail-control
        # A validation at the exit (0019, amendment A1): the claim made at the
        # reader on the fee the close will write and held on the open stay;
        # the close recording it as one ledger line with no door asked; a hold
        # no close takes given back, by the close or by the sweep; the phone on
        # stdin and kept nowhere; the money checked against the question; the
        # reconciler comparing the engine's number without the line. Each
        # property is broken in turn, plus three schema statements never
        # created, and the suite must go red.
        run: npm run validations-fail-control

      - name: Validations-door fail-control
        # The door is named by VALIDATIONS_DOOR and by nothing else. Each break
        # removes one property of that -- a default put back, the refusal
        # skipped or reworded, a value that is not a bare command run, a
        # deployment with no door answering "not validated" -- and requires
        # test/validations-door.test.js to go red.
        run: npm run validations-door-fail-control

      - name: Stripe-account fail-control
        # A garage's own Stripe account (0020): created only on the operator's
        # request, as the garage's -- no Stripe dashboard, its own Stripe
        # fees, Stripe responsible for its losses, card_payments asked for,
        # its country checked before anything is reserved -- never twice (a reservation and its
        # idempotency key, and a stale key refused rather than reused), and a
        # refused create never locking the garage out (a definite refusal re-arms
        # with a new key; an unknown outcome keeps its key),
        # onboarded with the deployment's URLs, read back with each fact's
        # read time; and with no Connect configured, one sentence and nothing
        # asked. Each property is broken in turn, plus three schema statements
        # never created, and the suite must go red.
        run: npm run stripe-account-fail-control

      - name: Taxes fail-control
        # A garage's taxes (0022): a set judged by the engine's own door and by
        # nothing here, before anything reads it; stored as the engine read it;
        # a set the platform cannot hold refused as storage, by that name; the
        # garage's whole list proved to load before the save commits; "none" a
        # set that SAID zero rules; never two sets at one instant; and a garage
        # that cannot activate while its taxes are unstated -- at the route and
        # at the trigger. Nothing computes a percentage. Each property is
        # broken in turn -- one of them a single character -- plus six schema
        # statements never created, and the suite must go red.
        run: npm run taxes-fail-control

      - name: Setup fail-control
        # U4: the setup checklist worked out from the garage's own rows; lane
        # setup and closing, the garage only from the session and the path, a
        # used lane never removed, the last open lane closed only on purpose;
        # every write's change-log line in its own transaction, refusals in
        # the right log, no credential in a line, and the log append-only for
        # the application and the owner alike. Each property is broken in
        # turn, two of them on a scratch database, and each must turn its own
        # test red.
        run: npm run setup-fail-control

      - name: Alerts fail-control
        # U4b: who gets which alert. The garage only from the session and the
        # path; phone numbers and email addresses kept one way or refused
        # with their reason; no text without a phone and no email without an
        # address; at most 25 people and a bounded name in the database too;
        # no person's number or address in any log or the server's output;
        # each change and its line one transaction; the checklist step worked
        # out from the rows, never holding opening back; and nothing sent.
        # Each property is broken in turn, some on a scratch database, and
        # each must turn its own test red.
        run: npm run alerts-fail-control

      - name: Board fail-control
        # U4c: full refused on a way out, by the route and the database; a
        # character the lane's screen cannot draw refused by name; the lane's
        # state and board on the fast read; a message only on its own lanes
        # and not once it has ended; the price switch reaching its lane; a
        # message only on lanes of its own garage. Each property is broken in
        # turn and each must turn its own test red.
        run: npm run board-fail-control


  sign-in-control:
    name: sign-in-control (${{ matrix.shard }}/8)
    # The owner sign-in fail-control, which alone took most of an hour in one
    # job: a run of the sign-in suite per break. Each shard has its own runner
    # and database.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/test-environment

      - name: The suite runs with no Stripe Connect configured
        # The standalone arm: a self-hoster with no Connect -- or no Stripe --
        # gets a platform that behaves exactly as it did before Connect code
        # existed. Every test below runs in this environment, so this is
        # asserted rather than assumed; test/standalone-arm.test.js boots the
        # real entrypoint the same way.
        run: |
          for v in STRIPE_API_KEY STRIPE_API_BASE CONNECT_RETURN_URL CONNECT_REFRESH_URL; do
            if [ -n "$(printenv "$v")" ]; then echo "$v is set; the suite must run without Connect"; exit 1; fi
          done
          echo "no Connect setting present"

      - name: The suite runs with no validations door named
        # This repository names no validations module: VALIDATIONS_DOOR has no
        # default, and unset means the deployment has none. The tests that need
        # the door name the stand-in themselves; everything else runs as a
        # deployment without one.
        run: |
          if [ -n "$(printenv VALIDATIONS_DOOR)" ]; then echo "VALIDATIONS_DOOR is set; the suite must run without it"; exit 1; fi
          echo "no validations door named"

      - name: Owner sign-in fail-control
        # The owner's sign-in (0024). Each break removes one property -- the
        # mount order, a token or a message in the log, the parser's text in
        # a response, a credential read from the query, the unknown email's
        # hash, the lock's count, its address, the header it must not trust,
        # the idle and absolute ends, sign-out and reset revoking, the cookie's
        # HttpOnly and Secure, the Origin rule, the password argument refused,
        # no-store, the length rule, and a session accepted as a key -- and
        # requires the sign-in suites to go red.
        #
        # The breaks are spread over 8 jobs (the matrix above); `test` below
        # proves the shards add up to one whole run: every break exactly once.
        run: npm run owner-sign-in-fail-control -- --shard ${{ matrix.shard }}/8

      - name: Owner sign-in fail-control, this shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-in-control-shard-${{ matrix.shard }}
          path: sign-in-control-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true


  test:
    # The name branch protection requires. It runs whatever happened above, and
    # is green only when every job it needs is: a job that failed, was
    # cancelled or was skipped makes it red. Then it requires the sign-in
    # shards to add up to one whole run.
    name: test
    if: always()
    needs: [suite, controls, sign-in-control]
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the tests passed
        env:
          SUITE: ${{ needs.suite.result }}
          CONTROLS: ${{ needs.controls.result }}
          SIGN_IN_CONTROL: ${{ needs.sign-in-control.result }}
        run: |
          echo "suite: $SUITE, controls: $CONTROLS, sign-in-control: $SIGN_IN_CONTROL"
          [ "$SUITE" = success ] && [ "$CONTROLS" = success ] && [ "$SIGN_IN_CONTROL" = success ]
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: sign-in-control-shard-*
          merge-multiple: true
          path: sign-in-control-shards
      - name: Owner sign-in fail-control, every break exactly once
        # Shards 1..N each reported once, every item of `--plan` ran in exactly
        # one of them and nothing else did, and no control failed.
        run: node scripts/owner-sign-in-fail-control.js --verify sign-in-control-shards
