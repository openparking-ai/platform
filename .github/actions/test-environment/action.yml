name: The test environment
description: >-
  Node, the npm packages, the rate engine and the two entitlement modules at
  their pins, and a test database migrated by an ordinary owner, with its
  application role. Every job that runs tests or fail-controls starts here,
  so each runs in the environment the suite always ran in. Needs the
  Postgres service and the workflow's database settings.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - shell: bash
      run: npm ci
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the rate engine at its pin
      # test/rate-plans.test.js starts the REAL engine, because the plan
      # store's claims -- an unknown key refused and named, a gap refused
      # and listed -- are the engine's sentences, and a stand-in would test
      # this platform against itself. The commit is `rate-engine.pin`, one
      # place, read here and nowhere else.
      shell: bash
      run: python3 -m pip install --quiet "git+https://github.com/openparking-ai/rate-engine@$(cat rate-engine.pin)"
    - name: Install the two entitlement modules at their pins, and check out their migrations
      # test/exit-outcomes.test.js consults the REAL garage-pass and
      # monthly-billing through their command lines, each against a
      # database built from its own migrations (0015). The commits are
      # `garage-pass.pin` and `monthly-billing.pin`; the checkouts are only
      # for the migrations, which the installed packages do not ship.
      shell: bash
      run: |
        python3 -m pip install --quiet \
          "openparking-garage-pass[store] @ git+https://github.com/openparking-ai/garage-pass@$(cat garage-pass.pin)" \
          "openparking-monthly-billing[store] @ git+https://github.com/openparking-ai/monthly-billing@$(cat monthly-billing.pin)"
        for m in garage-pass monthly-billing; do
          git init -q "$RUNNER_TEMP/$m"
          git -C "$RUNNER_TEMP/$m" fetch -q --depth 1 "https://github.com/openparking-ai/$m" "$(cat $m.pin)"
          git -C "$RUNNER_TEMP/$m" checkout -q FETCH_HEAD
        done
        echo "GARAGE_PASS_SRC=$RUNNER_TEMP/garage-pass" >> "$GITHUB_ENV"
        echo "MONTHLY_BILLING_SRC=$RUNNER_TEMP/monthly-billing" >> "$GITHUB_ENV"
    - name: Prepare the database -- the one step that runs as a superuser
      # Makes the ordinary owner (NOSUPERUSER, NOBYPASSRLS) and the database,
      # applies 0001 -- whose role statement only a superuser may run -- and
      # hands what it made to the owner, and gives the application role its
      # login: NOSUPERUSER, NOBYPASSRLS. A superuser bypasses row-level
      # security unconditionally, so neither the owner nor the application
      # may be one -- for the owner, that is how production runs; for the
      # application, it is what makes every isolation assertion mean anything.
      shell: bash
      run: npm run prepare-database
    - name: Migrate, as the ordinary owner
      # Every migration from 0002 on, the way production runs them. A definer
      # that relies on seeing past a FORCED policy fails here, where it
      # failed on a live host while CI migrated as a superuser and passed.
      shell: bash
      run: npm run migrate
